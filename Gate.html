<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitequest Gateway | Night Call</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap");

    :root {
      --bg-deep: #070405;
      --bg-mid: #18090d;
      --bg-glow: #5e0f1a;
      --blood: #c62839;
      --blood-bright: #f7445b;
      --bone: #f2ede7;
      --text-main: #f5f1ec;
      --text-muted: #b8a9a4;
      --line: rgba(255, 245, 237, 0.18);
      --success: #7ee787;
      --danger: #ff7686;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: "Space Grotesk", "Avenir Next", "Trebuchet MS", sans-serif;
      color: var(--text-main);
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(1200px 800px at 8% 0%, rgba(98, 9, 26, 0.45) 0%, transparent 55%),
        radial-gradient(1000px 760px at 100% 100%, rgba(63, 10, 18, 0.5) 0%, transparent 52%),
        linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-mid) 55%, #050405 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 50% 50%, transparent 25%, rgba(0, 0, 0, 0.68) 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.015),
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 3px
        );
      mix-blend-mode: screen;
    }

    .rain {
      position: fixed;
      inset: 0;
      z-index: -4;
      opacity: 0.55;
    }

    .fog {
      position: fixed;
      width: 130vmax;
      height: 40vmax;
      border-radius: 50%;
      pointer-events: none;
      z-index: -3;
      filter: blur(45px);
      opacity: 0.25;
      animation: drift 18s linear infinite alternate;
    }

    .fog.a {
      top: -10vmax;
      left: -35vmax;
      background: radial-gradient(circle at 50% 50%, rgba(145, 24, 38, 0.8), transparent 62%);
    }

    .fog.b {
      bottom: -20vmax;
      right: -30vmax;
      background: radial-gradient(circle at 50% 50%, rgba(226, 59, 89, 0.55), transparent 65%);
      animation-delay: -6s;
      animation-duration: 24s;
    }

    .noise {
      position: fixed;
      inset: -80%;
      z-index: -2;
      pointer-events: none;
      opacity: 0.07;
      background-image: radial-gradient(circle, #fff 0.7px, transparent 0.7px);
      background-size: 4px 4px;
      animation: noiseMove 0.45s steps(3) infinite;
    }

    .gate-shell {
      width: min(600px, calc(100vw - 2rem));
      padding: clamp(1.1rem, 3vw, 1.9rem);
      border-radius: 24px;
      border: 1px solid var(--line);
      background:
        linear-gradient(165deg, rgba(25, 13, 15, 0.8), rgba(10, 6, 7, 0.93)),
        radial-gradient(circle at 8% 8%, rgba(247, 68, 91, 0.12), transparent 45%);
      backdrop-filter: blur(5px);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 35px 70px rgba(0, 0, 0, 0.72),
        0 0 60px rgba(177, 28, 48, 0.3);
      transform: translateY(12px) scale(0.985);
      opacity: 0;
      animation: rise 700ms ease forwards;
    }

    .gate-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(
        120deg,
        transparent 8%,
        rgba(255, 255, 255, 0.06) 30%,
        transparent 43%,
        transparent 62%,
        rgba(247, 68, 91, 0.12) 100%
      );
      mix-blend-mode: screen;
    }

    .gate-shell::after {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 1.1rem;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .status-live {
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, #ffd6db, var(--blood-bright));
      box-shadow: 0 0 14px rgba(247, 68, 91, 0.95);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .title-wrap {
      display: grid;
      gap: 0.45rem;
    }

    h1 {
      margin: 0;
      font-family: "Cinzel", "Times New Roman", serif;
      font-size: clamp(1.95rem, 7vw, 2.8rem);
      letter-spacing: 0.15em;
      line-height: 1;
      text-transform: uppercase;
    }

    .glitch {
      position: relative;
      display: inline-block;
      color: var(--bone);
      text-shadow:
        0 0 16px rgba(242, 237, 231, 0.2),
        0 0 28px rgba(247, 68, 91, 0.25);
      animation: titleJitter 4s steps(1, end) infinite;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      opacity: 0.65;
      pointer-events: none;
    }

    .glitch::before {
      color: rgba(247, 68, 91, 0.65);
      transform: translate(-2px, 0);
      clip-path: inset(0 0 45% 0);
    }

    .glitch::after {
      color: rgba(245, 241, 236, 0.45);
      transform: translate(2px, 0);
      clip-path: inset(48% 0 0 0);
    }

    .subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.86rem;
      line-height: 1.45;
      letter-spacing: 0.04em;
      max-width: 47ch;
    }

    .headline-zone {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1.1rem;
    }

    .ghostface {
      width: clamp(86px, 20vw, 122px);
      aspect-ratio: 0.92;
      display: grid;
      place-items: center;
      position: relative;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.65));
      animation: floatMask 4.6s ease-in-out infinite;
      isolation: isolate;
    }

    .ghostface-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 32%;
      border-radius: 28% 28% 36% 36% / 30% 30% 44% 44%;
      border: 1px solid rgba(255, 247, 242, 0.28);
      transform-origin: center;
      animation: maskTilt 5.8s ease-in-out infinite;
      filter:
        saturate(0.85)
        contrast(1.1)
        brightness(0.88)
        drop-shadow(0 0 12px rgba(247, 68, 91, 0.28));
      clip-path: polygon(
        12% 8%,
        22% 2%,
        78% 2%,
        88% 8%,
        95% 24%,
        96% 56%,
        90% 84%,
        74% 98%,
        26% 98%,
        10% 84%,
        4% 56%,
        5% 24%
      );
      position: relative;
      z-index: 2;
    }

    .ghostface::before {
      content: "";
      position: absolute;
      inset: 6% 8% 2% 8%;
      border-radius: 30% 30% 42% 42% / 34% 34% 48% 48%;
      background: radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.12), transparent 50%);
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .ghostface::after {
      content: "";
      position: absolute;
      inset: 2%;
      border-radius: 32% 32% 44% 44% / 34% 34% 52% 52%;
      background: radial-gradient(circle at 50% 100%, rgba(10, 8, 9, 0.65), transparent 50%);
      z-index: 1;
      pointer-events: none;
    }

    .ghostface .ring {
      position: absolute;
      inset: -11%;
      border-radius: 50%;
      border: 1px solid rgba(247, 68, 91, 0.38);
      animation: ringPulse 3.2s ease-out infinite;
    }

    .ghostface .ring.two {
      inset: -24%;
      animation-delay: 0.9s;
      opacity: 0.7;
    }

    .gate-form {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.2rem;
    }

    .gate-form label {
      font-size: 0.72rem;
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.6rem;
      align-items: stretch;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap::before {
      content: ">";
      position: absolute;
      left: 0.82rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      color: rgba(255, 193, 203, 0.78);
      font-size: 0.95rem;
      pointer-events: none;
    }

    #code-input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(44, 23, 26, 0.72), rgba(21, 10, 12, 0.86));
      padding: 0.9rem 1rem 0.9rem 1.75rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.34em;
      font-size: 1rem;
      text-align: center;
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    #code-input::placeholder {
      color: rgba(240, 227, 222, 0.33);
      letter-spacing: 0.24em;
    }

    #code-input:focus {
      border-color: rgba(247, 68, 91, 0.7);
      box-shadow:
        0 0 0 2px rgba(247, 68, 91, 0.2),
        0 0 28px rgba(247, 68, 91, 0.2);
    }

    .submit-btn {
      border: 1px solid rgba(255, 214, 219, 0.35);
      border-radius: 999px;
      background:
        linear-gradient(180deg, rgba(247, 68, 91, 0.92), rgba(166, 21, 43, 0.95)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.2), transparent 60%);
      color: #fff;
      padding: 0.86rem 1.25rem;
      font-size: 0.82rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      font-family: "Space Grotesk", "Avenir Next", "Trebuchet MS", sans-serif;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 130ms ease, box-shadow 130ms ease, filter 130ms ease;
      white-space: nowrap;
    }

    .submit-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 20%, rgba(255, 255, 255, 0.35) 52%, transparent 72%);
      transform: translateX(-150%);
      transition: transform 420ms ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.42),
        0 0 24px rgba(247, 68, 91, 0.38);
      filter: brightness(1.06);
    }

    .submit-btn:hover::before {
      transform: translateX(140%);
    }

    .submit-btn:active {
      transform: translateY(1px);
      box-shadow: none;
      filter: brightness(0.95);
    }

    .message {
      min-height: 1.15rem;
      font-size: 0.83rem;
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 0.1rem 0 0;
    }

    .message.success {
      color: var(--success);
      text-shadow: 0 0 9px rgba(126, 231, 135, 0.38);
    }

    .message.error {
      color: var(--danger);
      text-shadow: 0 0 9px rgba(255, 118, 134, 0.4);
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      color: rgba(201, 182, 177, 0.85);
      font-size: 0.69rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-family: "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      border-top: 1px dashed rgba(255, 255, 255, 0.16);
      padding-top: 0.65rem;
    }

    .scan-state {
      color: rgba(255, 201, 210, 0.95);
      text-align: right;
    }

    .shake {
      animation: shake 280ms ease-in-out;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.35);
      }
    }

    @keyframes titleJitter {
      0%,
      16%,
      100% {
        transform: translate(0, 0);
      }
      17% {
        transform: translate(-0.01em, 0.01em);
      }
      18% {
        transform: translate(0.012em, -0.01em);
      }
      19% {
        transform: translate(-0.006em, 0.012em);
      }
      20% {
        transform: translate(0, 0);
      }
    }

    @keyframes floatMask {
      0%,
      100% {
        transform: translateY(-3px);
      }
      50% {
        transform: translateY(4px);
      }
    }

    @keyframes maskTilt {
      0%,
      100% {
        transform: rotate(-1.4deg);
      }
      50% {
        transform: rotate(1.8deg);
      }
    }

    @keyframes ringPulse {
      0% {
        transform: scale(0.95);
        opacity: 0.75;
      }
      70%,
      100% {
        transform: scale(1.14);
        opacity: 0;
      }
    }

    @keyframes shake {
      0% {
        transform: translateX(0);
      }
      22% {
        transform: translateX(-8px);
      }
      45% {
        transform: translateX(7px);
      }
      68% {
        transform: translateX(-6px);
      }
      100% {
        transform: translateX(0);
      }
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(8vw, -4vh) scale(1.12);
      }
    }

    @keyframes noiseMove {
      0% {
        transform: translate(0, 0);
      }
      25% {
        transform: translate(2%, -3%);
      }
      50% {
        transform: translate(-2%, 3%);
      }
      75% {
        transform: translate(3%, 1%);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    @media (max-width: 650px) {
      .headline-zone {
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }

      .ghostface {
        justify-self: center;
      }

      .input-row {
        grid-template-columns: 1fr;
      }

      .submit-btn {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="rain-canvas" class="rain"></canvas>
  <div class="fog a"></div>
  <div class="fog b"></div>
  <div class="noise"></div>

  <main class="gate-shell" id="gate-shell">
    <section class="content">
      <div class="status-row">
        <span class="status-live"><span class="dot"></span>Jasmin</span>
        <span id="scan-state">Trace mode active</span>
      </div>

      <div class="headline-zone">
        <div class="title-wrap">
          <h1 class="glitch" data-text=" GORE GAME">GORE GAME</h1>
          <p class="subtitle">
            Gib den 6-stelligen Code ein
          </p>
        </div>

        <div class="ghostface" aria-hidden="true">
          <span class="ring"></span>
          <span class="ring two"></span>
          <img class="ghostface-photo" src="ghostface-photo.png" alt="Garry" />
        </div>
      </div>

      <form id="code-form" class="gate-form" autocomplete="off">
        <label for="code-input">Authorization Code</label>
        <div class="input-row">
          <div class="input-wrap">
            <input id="code-input" type="text" maxlength="6" placeholder="______" />
          </div>
          <button class="submit-btn" type="submit">Unlock</button>
        </div>
        <p id="message" class="message"></p>
        <div class="meta">
          <span id="attempt-info">Attempts: 0</span>
          <span>Mode: Verification</span>
        </div>
      </form>
    </section>
  </main>

  <script>
    const LEVEL_CODES = {
      X6D5M3: { level: 1, redirect: "XXXXX.html" },
      150010: { level: 2, redirect: "Level2_150010.html" },
      F1EX01: { level: 3, redirect: "Level3_F1EX01.html" }
    };

    const form = document.getElementById("code-form");
    const input = document.getElementById("code-input");
    const message = document.getElementById("message");
    const attemptInfo = document.getElementById("attempt-info");
    const gateShell = document.getElementById("gate-shell");
    const scanState = document.getElementById("scan-state");

    let attempts = 0;
    let redirecting = false;

    function normalizeCode(value) {
      return value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    }

    function showMessage(text, type = "") {
      message.textContent = text;
      message.className = "message";
      if (type) {
        message.classList.add(type);
      }
    }

    function shake(element) {
      element.classList.remove("shake");
      void element.offsetWidth;
      element.classList.add("shake");
    }

    input.addEventListener("input", () => {
      const cleaned = normalizeCode(input.value);
      input.value = cleaned;

      if (cleaned.length === 0) {
        showMessage("");
        return;
      }

      if (cleaned.length < 6) {
        showMessage("Bitte den vollstaendigen 6-stelligen Code eingeben.");
        return;
      }

      showMessage("Codeformat gueltig. Mit Unlock bestaetigen.", "success");
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const code = normalizeCode(input.value);
      input.value = code;

      if (!/^[A-Z0-9]{6}$/.test(code)) {
        showMessage("Code muss genau 6 Zeichen (A-Z, 0-9) enthalten.", "error");
        shake(gateShell);
        return;
      }

      attempts += 1;
      attemptInfo.textContent = "Attempts: " + attempts;

      const levelInfo = LEVEL_CODES[code];
      if (!levelInfo) {
        showMessage("Access denied. Falscher Code.", "error");
        shake(gateShell);
        return;
      }

      redirecting = true;
      const levelDisplay = String(levelInfo.level).padStart(2, "0");
      showMessage("Code erkannt. Weiterleitung zu Level " + levelDisplay + "...", "success");
      scanState.textContent = "Signal matched";

      setTimeout(() => {
        window.location.href = levelInfo.redirect;
      }, 720);
    });

    const states = [
      "Trace mode active",
      "Line unstable",
      "Voiceprint pending",
      "Mask signature scan"
    ];

    let stateIndex = 0;
    setInterval(() => {
      if (redirecting) {
        return;
      }
      stateIndex = (stateIndex + 1) % states.length;
      scanState.textContent = states[stateIndex];
    }, 2100);

    const canvas = document.getElementById("rain-canvas");
    const ctx = canvas.getContext("2d");
    const glyphs = "01#?<>/\\*".split("");
    const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let viewportWidth = 0;
    let viewportHeight = 0;
    let columns = 0;
    let drops = [];
    const fontSize = 16;

    function resizeRain() {
      const dpr = window.devicePixelRatio || 1;
      viewportWidth = window.innerWidth;
      viewportHeight = window.innerHeight;

      canvas.width = Math.floor(viewportWidth * dpr);
      canvas.height = Math.floor(viewportHeight * dpr);
      canvas.style.width = viewportWidth + "px";
      canvas.style.height = viewportHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      columns = Math.ceil(viewportWidth / fontSize) + 2;
      drops = Array.from({ length: columns }, () => -Math.random() * 32);
    }

    function drawRain() {
      ctx.fillStyle = "rgba(7, 4, 5, 0.16)";
      ctx.fillRect(0, 0, viewportWidth, viewportHeight);

      ctx.font = fontSize + 'px "JetBrains Mono", monospace';

      for (let i = 0; i < columns; i += 1) {
        const symbol = glyphs[Math.floor(Math.random() * glyphs.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        const highlight = Math.random() > 0.965;
        ctx.fillStyle = highlight ? "rgba(255, 239, 243, 0.95)" : "rgba(223, 62, 88, 0.64)";
        ctx.fillText(symbol, x, y);

        if (y > viewportHeight && Math.random() > 0.975) {
          drops[i] = -Math.random() * 18;
        } else {
          drops[i] += 0.72 + Math.random() * 0.4;
        }
      }

      requestAnimationFrame(drawRain);
    }

    resizeRain();
    window.addEventListener("resize", resizeRain);

    if (!prefersReducedMotion) {
      requestAnimationFrame(drawRain);
    } else {
      ctx.fillStyle = "rgba(7, 4, 5, 0.35)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
